# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmchart-source-v1.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kong
  namespace: kong
spec:
  interval: 10m
  chart: kong
  sourceRef:
    kind: HelmRepository
    name: kong-repository
  version: "3.0.1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong
  namespace: kong
spec:
  interval: 1m0s
  chart:
    spec:
      chart: kong
      version: "3.0.1"
      sourceRef:
        kind: HelmRepository
        name: kong-repository
        namespace: kong
      interval: 10m
  values:
    env:
      stream_listen: "0.0.0.0:10443 ssl, 0.0.0.0:10022"
      database: "postgres"
      pg_host: "global-pg-rw.tools.svc.cluster.local"
      log_level: "debug"
      pg_database: "kong"
      pg_ssl: "off"
      pg_ssl_verify: "off"
      pg_user:
        valueFrom:
          secretKeyRef:
            name: pgsql-kong
            key: username
      pg_password:
        valueFrom:
          secretKeyRef:
            name: pgsql-kong
            key: password
    migrations:
      enabled: true
      init: true
      preUpgrade: true
      postUpgrade: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: usage
                  operator: In
                  values:
                    - worker
    podLabels:
      app.kubernetes.io/part-of: kong
      mtls/name: kong-proxy
    proxy:
      enabled: true
      nameOverride: kong
      loadBalancerIP: 10.15.25.100
      externalTrafficPolicy: Local
      labels:
        app.kubernetes.io/part-of: kong
        app.kubernetes.io/component: proxy
        mtls/name: kong-proxy
    udpProxy:
      enabled: false
      externalTrafficPolicy: Local
      loadBalancerIP: 10.15.25.101
    ingressController:
      installCRDs: true
      enabled: true
      rbac:
        create: true
    certificates:
      enabled: false
    extraResources:
      - apiVersion: v1
        kind: Service
        metadata:
          name: kong-proxy-passthrough
          namespace: kong
        spec:
          type: LoadBalancer
          loadBalancerIP: 10.15.25.101
          externalTrafficPolicy: Local
          selector:
            app.kubernetes.io/instance: kong
            app.kubernetes.io/component: app
            app.kubernetes.io/name: kong
          ports:
            - name: stream-443
              port: 443
              targetPort: 10443
              protocol: TCP
            - name: ssh-10022
              port: 10022
              targetPort: 10022
              protocol: TCP

