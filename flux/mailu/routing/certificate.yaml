apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mailu-certs
  namespace: mailu
spec:
  secretName: mailu-certs
  additionalOutputFormats:
    - type: CombinedPEM
    - type: DER
  dnsNames:
    - 'yannis.codes'
    - 'mail.yannis.codes'
    - 'kys.dog'
  issuerRef:
    name: le-prod
    kind: ClusterIssuer

