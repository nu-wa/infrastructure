---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 1m0s
  targetNamespace: media
  chartRef:
    kind: OCIRepository
    name: seerr-chart
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: usage
                  operator: In
                  values:
                    - worker
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      privileged: false
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    service:
      type: ClusterIP
      port: 80
    config:
      persistence:
        size: 5Gi
        storageClass: "longhorn"
    extraEnv:
      - name: TZ
        value: Europe/Berlin
      - name: LOG_LEVEL
        value: info
    ingress:
      ingressClassName: "ksbh"
      annotations:
        ksbh.rs/modules: "oidc"
      tls:
        - hosts:
            - seerr.kys.dog
          secretName: kys-dog
      hosts:
        - host: seerr.kys.dog
          paths:
            - path: /
              pathType: ImplementationSpecific
