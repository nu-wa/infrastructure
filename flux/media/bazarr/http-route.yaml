apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr
  namespace: media
  labels:
    app.kubernetes.io/name: bazarr
  annotations:
    ksbh.rs/modules: "https,oidc"
spec:
  ingressClassName: ksbh
  tls:
    - secretName: kys.dog
      hosts:
        - bazarr.kys.dog
  rules:
    - host: bazarr.kys.dog
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: bazarr
                port:
                  number: 6767
