# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmchart-source-v1.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 10m
  chart: jellyfin
  sourceRef:
    kind: HelmRepository
    name: jellyfin
  version: "3.2.0"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  interval: 1m0s
  targetNamespace: media
  chartRef:
    kind: HelmChart
    name: jellyfin
    namespace: media
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: usage
                  operator: In
                  values:
                    - worker
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "10.11.8"
      pullPolicy: IfNotPresent
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    ingress:
      enabled: true
      className: "ksbh"
      annotations:
        cert-manager.io/cluster-issuer: "le-prod"
        ksbh.rs/modules: "https"
        ksbh.rs/excluded-modules: "pow"
      hosts:
        - host: 67mjelly.kys.dog
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: kys-dog
          hosts:
            - 67mjelly.kys.dog
    volumes:
      - name: transcode
        emptyDir: {}
    volumeMounts:
      - name: transcode
        mountPath: /transcode
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: longhorn
      media:
        enabled: true
        type: pvc
        existingClaim: media-nfs
        readOnly: true
      cache:
        enabled: false
    metrics:
      enabled: true
