apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
  labels:
    app.kubernetes.io/name: sabnzbd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: usage
                    operator: In
                    values:
                      - worker
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-wireguard-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /config/wireguard
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sabnzbd
          image: ghcr.io/hotio/sabnzbd:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1001"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Berlin
            - name: WEBUI_PORTS
              value: "8080/tcp"
            - name: VPN_ENABLED
              value: "true"
            - name: VPN_CONF
              value: "wg0"
            - name: VPN_PROVIDER
              value: "proton"
            - name: VPN_LAN_NETWORK
              value: "10.0.0.0/8"
            - name: VPN_LAN_LEAK_ENABLED
              value: "false"
            - name: VPN_AUTO_PORT_FORWARD
              value: "true"
            - name: VPN_HEALTHCHECK_ENABLED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tun
              mountPath: /dev/net/tun
            - name: protonvpn-wireguard
              mountPath: /config/wireguard/wg0.conf
              subPath: wg0.conf
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: data
          persistentVolumeClaim:
            claimName: media-nfs
        - name: proton
          secret:
            secretName: proton
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
