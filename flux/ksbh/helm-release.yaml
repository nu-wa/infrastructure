# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmchart-source-v1.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: ksbh
  namespace: ksbh
spec:
  interval: 10m
  chart: ksbh
  sourceRef:
    kind: HelmRepository
    name: ksbh
  version: "0.1.0"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ksbh
  namespace: ksbh
spec:
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  interval: 1m0s
  targetNamespace: ksbh
  chartRef:
    kind: HelmChart
    name: ksbh
    namespace: ksbh
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: usage
                  operator: In
                  values:
                    - worker
    image:
      repository: "nuwa24/ksbh"
      tag: "latest-dev" # {"$imagepolicy": "ksbh:ksbh"}
      pullPolicy: Always
    app:
      redisUrl: "redis://tools-valkey.tools.svc.cluster.local:6379"
      configPaths:
        modules: "/app/data/modules"
    persistence:
      enabled: true
      claimName: "ksbh-data"
      size: 64Gi
      storageClassName: "longhorn"
      mountPath: /app/data
    service:
      type: LoadBalancer
      loadBalancerIP: 10.15.25.110
      http: 80
      https: 443
