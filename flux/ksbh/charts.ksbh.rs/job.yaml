apiVersion: batch/v1
kind: Job
metadata:
  name: ksbh-charts
  namespace: ksbh
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: harbor.internal.yannis.codes/registry/ksbh-charts:97d785d7c500-20260325022130 # {"$imagepolicy": "ksbh:ksbh-charts"}
          command:
            - /bin/sh
            - -ec
            - |
              test -d /payload
              mkdir -p /data/static/charts.ksbh.rs
              rsync -a --delete-delay /payload/ /data/static/charts.ksbh.rs/
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ksbh-data
