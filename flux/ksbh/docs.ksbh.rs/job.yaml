apiVersion: batch/v1
kind: Job
metadata:
  name: docs-ksbh-rs
  namespace: ksbh
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: harbor.internal.yannis.codes/registry/ksbh-docs:d63c20aa3eea-20260327190432 # {"$imagepolicy": "ksbh:ksbh-docs"}
          command:
            - /bin/sh
            - -ec
            - |
              test -d /payload
              mkdir -p /data/static/ksbh.rs
              rsync -a --delete-delay /payload/ /data/static/ksbh.rs/
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ksbh-data
