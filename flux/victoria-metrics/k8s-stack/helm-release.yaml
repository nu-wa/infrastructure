apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: victoria-metrics-k8s-stack
  namespace: victoria-metrics
spec:
  interval: 10m
  chart: victoria-metrics-k8s-stack
  sourceRef:
    kind: HelmRepository
    name: victoria-metrics
  version: "0.67.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: victoria-metrics
spec:
  interval: 1m0s
  chartRef:
    kind: HelmChart
    name: victoria-metrics-k8s-stack
    namespace: victoria-metrics
  values:
    victoria-metrics-operator:
      enabled: true
      image:
        repository: victoriametrics/operator
        tag: "v0.66.1"
      crds:
        enabled: true
        cleanup:
          enabled: true
        upgrade:
          enabled: true
          forceConflicts: true
      serviceMonitor:
        enabled: false
      operator:
        disable_prometheus_converter: true
    defaultDashboards:
      enabled: true
      defaultTimezone: utc
      grafanaOperator:
        enabled: false
      dashboards:
        victoriametrics-vmalert:
          enabled: true
        victoriametrics-operator:
          enabled: true
    vmsingle:
      enabled: true
      spec:
        port: "8428"
        retentionPeriod: "1"
        storage:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 64Gi
      ingress:
        enabled: true
        annotations:
          ksbh.rs/modules: "oidc-authentik"
        hosts:
          - vm.kys.dog
        tls:
          - secretName: "kys-dog"
            hosts:
              - "vm.kys.dog"
        ingressClassName: "ksbh"
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        annotations:
          ksbh.rs/modules: "oidc-authentik"
        hosts:
          - vm-am.kys.dog
        tls:
          - secretName: "kys-dog"
            hosts:
              - "vm-am.kys.dog"
        ingressClassName: "ksbh"
    vmalert:
      enabled: true
      ingress:
        enabled: true
        annotations:
          ksbh.rs/modules: "oidc-authentik"
        hosts:
          - vm-al.kys.dog
        tls:
          - secretName: "kys-dog"
            hosts:
              - "vm-al.kys.dog"
        ingressClassName: "ksbh"
    vmagent:
      enabled: true
      ingress:
        enabled: true
        annotations:
          ksbh.rs/modules: "oidc-authentik"
        hosts:
          - vm-ag.kys.dog
        tls:
          - secretName: "kys-dog"
            hosts:
              - "vm-ag.kys.dog"
        ingressClassName: "ksbh"
      extraScrapeConfigs:
        - job_name: 'k8s-services'
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_label_victoria_metrics_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_service_name]
              target_label: job
            - source_labels: [__meta_kubernetes_endpoint_address_target_name, __meta_kubernetes_endpoint_port_name]
              separator: ":"
              target_label: instance
    defaultDatasources:
      grafanaOperator:
        enabled: false
      victoriametrics:
        perReplica: true
      alertmanager:
        perReplica: true
        datasources:
          - name: Alertmanager
            access: proxy
            jsonData:
              implementation: prometheus
    grafana:
      enabled: true
      image:
        repository: grafana/grafana
        tag: "12.2.1"
      forceDeployDatasource: true
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      ingress:
        enabled: true
        annotations:
          ksbh.rs/modules: "oidc-authentik"
        hosts:
          - vm-gr.kys.dog
        tls:
          - secretName: "kys-dog"
            hosts:
              - "vm-gr.kys.dog"
        ingressClassName: "ksbh"
      persistence:
        type: pvc
        enabled: true
        storageClassName: "longhorn"
        size: 32Gi
    defaultScrapeService:
      namespace: kube-system
    prometheus-node-exporter:
      enabled: true
      vmScrape:
        enabled: true
    kube-state-metrics:
      enabled: true
    kubelet:
      enabled: true
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: true
    kubeDns:
      enabled: false
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: false

