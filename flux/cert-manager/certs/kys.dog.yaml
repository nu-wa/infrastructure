apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kys-dog
  namespace: cert-manager
spec:
  secretName: kys-dog 
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  dnsNames:
    - kys.dog
    - '*.kys.dog'
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
