apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: yannis-codes
  namespace: cert-manager
spec:
  secretName: yannis-codes

  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  dnsNames:
    - yannis.codes
    - *.yannis.codes
  ipAddresses:
    - 195.201.85.168
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
