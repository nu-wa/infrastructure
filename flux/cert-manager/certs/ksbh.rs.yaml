apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ksbh-rs
  namespace: cert-manager
spec:
  secretName: ksbh-rs
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  dnsNames:
    - ksbh.rs
    - "*.ksbh.rs"
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
