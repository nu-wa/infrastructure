# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmchart-source-v1.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: cnpg-operator
  namespace: tools
spec:
  interval: 10m
  chart: cloudnative-pg
  sourceRef:
    kind: HelmRepository
    name: cnpg
  version: "0.26.1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: cnpg-operator
    namespace: tools
spec:
    interval: 1m0s
    targetNamespace: cnpg
    chartRef:
      kind: HelmChart
      name: cnpg-operator
      namespace: tools
    install:
        remediation:
            retries: 100
    values:
