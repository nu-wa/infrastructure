apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parca-agent
  namespace: tools
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["list", "watch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: parca-agent
  namespace: tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: parca-agent
subjects:
- kind: ServiceAccount
  name: parca-agent
  namespace: tools
---
apiVersion: v1
data:
  parca-agent.yaml: |-
    relabel_configs:
    - source_labels:
      - "__meta_kubernetes_pod_label_parca_profiling"
      regex: "enabled"
      action: keep
    - source_labels: ["__meta_kubernetes_namespace"]
      target_label: "namespace"
    - source_labels: ["__meta_kubernetes_pod_name"]
      target_label: "pod"
    - source_labels: ["__meta_kubernetes_pod_container_name"]
      target_label: "container"
kind: ConfigMap
metadata:
  name: parca-agent
  namespace: tools
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: parca-agent
  namespace: tools
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: parca-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parca-agent
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: usage
                    operator: In
                    values:
                      - worker
      hostPID: true
      serviceAccountName: parca-agent
      containers:
      - args:
        - --http-address=:7071
        - --node=$(NODE_NAME)
        - --config-path=/etc/parca-agent/parca-agent.yaml
        - --remote-store-address=parca.tools.svc.cluster.local:7070
        - --remote-store-insecure
        - --profiling-cpu-sampling-frequency=11
        - --mem-limit=128M
        - --debuginfo-strip=true
        - --debuginfo-upload-max-parallel=1
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: ghcr.io/parca-dev/parca-agent:v0.44.2
        name: parca-agent
        ports:
        - containerPort: 7071
          name: http
        resources:
          requests:
            cpu: 40m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN"]
        volumeMounts:
        - mountPath: /run
          name: run
        - mountPath: /lib/modules
          name: modules
          readOnly: true
        - mountPath: /sys/fs/bpf
          name: bpffs
        - mountPath: /etc/parca-agent
          name: config
      volumes:
      - hostPath:
          path: /run
        name: run
      - hostPath:
          path: /lib/modules
        name: modules
      - hostPath:
          path: /sys/fs/bpf
        name: bpffs
      - configMap:
          name: parca-agent
        name: config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parca-agent
  namespace: tools
