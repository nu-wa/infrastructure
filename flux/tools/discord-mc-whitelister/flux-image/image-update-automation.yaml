apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
    name: discord-bot-minecraft-whitelister
    namespace: tools
spec:
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
    update:
        path: ./clusters/cluster.internal.pve/tools/discord-mc-whitelister
        strategy: Setters
    git:
        checkout:
            ref:
                branch: main
        push:
            branch: main
        commit:
            author:
                email: group258_bot1@noreply.git.yannis.codes
                name: fluxcdbot
            messageTemplate: |
                Automated image update

                Automation name: {{ .AutomationObject }}

                Files:
                {{ range $filename, $_ := .Updated.Files -}}
                - {{ $filename }}
                {{ end -}}

                Objects:
                {{ range $resource, $_ := .Updated.Objects -}}
                - {{ $resource.Kind }} {{ $resource.Name }}
                {{ end -}}

                Images:
                {{ range .Updated.Images -}}
                - {{.}}
                {{ end -}}
