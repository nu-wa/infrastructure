apiVersion: v1
kind: PersistentVolume
metadata:
    name: discord-bot-minecraft-whitelister
    namespace: tools
spec:
    capacity:
        storage: 1Gi
    volumeMode: Filesystem
    accessModes:
        - ReadWriteOnce
    persistentVolumeReclaimPolicy: Delete
    storageClassName: longhorn
    csi:
        driver: driver.longhorn.io
        fsType: ext4
        volumeAttributes:
            numberOfReplicas: "3"
            staleReplicaTimeout: "2880"
        volumeHandle: "discord-bot-minecraft-whitelister"
