# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmchart-source-v1.json
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  chart: authentik
  sourceRef:
    kind: HelmRepository
    name: authentik
  version: "2026.2.1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1m0s
  targetNamespace: authentik
  chartRef:
    kind: HelmChart
    name: authentik
    namespace: authentik
  values:
    global:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: usage
                    operator: In
                    values:
                      - worker
      envFrom:
        - secretRef:
            name: authentik-secrets

    postgresql:
      enabled: false

    authentik:
      existingSecret:
        secretName: authentik-secrets
      log_level: debug
      postgresql:
        host: global-pg-rw.tools.svc.cluster.local
        name: authentik
        port: 5432
      redis:
        host: authentik-redis-headless.authentik.svc.cluster.local
      email:
        host: mailu-front.mailu.svc.cluster.local
        username: authentik@yannis.codes
        use_tls: true
      avatars: none
      error_reporting:
        enabled: false
      disable_update_check: true
      disable_startup_analytics: true

    server:
      ingress:
        enabled: true
        ingressClassName: ksbh
        hosts:
          - authentik.yannis.codes
        annotations:
          ksbh.rs/modules: "https"
        tls:
          - secretName: yannis-codes
            hosts:
              - authentik.yannis.codes
