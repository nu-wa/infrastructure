apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: gitlab
  namespace: gitlab
spec:
  imageRepositoryRef:
    name: gitlab
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-ee\.[0-9]+$'
    extract: '$version'
  policy:
    semver:
      range: '>=16.0.0'
